name: Free API-less repository audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/free-api-less-audit.yml"
  schedule:
    - cron: "35 20 * * 1"
  pull_request:
    paths:
      - ".github/workflows/free-api-less-audit.yml"
      - "scripts/free-audit.cjs"
      - "tests/free-audit.test.cjs"
      - "scripts/content-quality-audit.py"

permissions:
  contents: read

concurrency:
  group: free-api-less-audit
  cancel-in-progress: false

jobs:
  test-auditor:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/free-audit.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/automation-audit.py --self-test
      - run: python scripts/content-quality-audit.py --self-test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        repository:
          - pass-juken-academy2026/english-study
          - pass-juken-academy2026/math-juken-saitama
          - pass-juken-academy2026/junior-japanese
          - pass-juken-academy2026/junior-science
          - pass-juken-academy2026/junior-social-studies
          - pass-juken-academy2026/highschool-japanese
          - pass-juken-academy2026/highschool-math
          - pass-juken-academy2026/highschool-biology
          - pass-juken-academy2026/highschool-social-studies
          - pass-juken-academy2026/highschool-information
          - pass-juken-academy2026/learning-portal
    steps:
      - name: Check out auditor
        uses: actions/checkout@v4
        with:
          repository: pass-juken-academy2026/learning-portal
          ref: ${{ github.event.pull_request.head.ref || 'main' }}
          path: auditor
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test auditor
        run: node auditor/tests/free-audit.test.cjs
      - name: Test content quality scanner
        run: python auditor/scripts/content-quality-audit.py --self-test
      - name: Check out target repository (public read-only)
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: main
          path: target
          persist-credentials: false
      - name: Run existing question-bank quality tests
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          for test in \
            tests/common-test-audit.cjs \
            tests/validate-entrance-bank.cjs \
            tests/audit-bank-quality.cjs \
            tests/validate-bank-data.cjs \
            tests/validate-question-bank.cjs \
            tests/validate-data.cjs \
            tests/english-common-stimulus-content.test.cjs \
            tests/audit-common-test-stimuli.test.cjs; do
            if [ -f "$test" ]; then
              echo "Running $test"
              node "$test"
            fi
          done
      - name: Install Playwright for PDF/export tests
        if: ${{ hashFiles('target/tests/pdf-export-audit.cjs', 'target/tests/english-mock-pdf-export.test.cjs') != '' }}
        run: npm install --no-save playwright
        timeout-minutes: 5
      - name: Install Chromium dependencies for PDF/export tests
        if: ${{ hashFiles('target/tests/pdf-export-audit.cjs', 'target/tests/english-mock-pdf-export.test.cjs') != '' }}
        run: npx playwright install-deps chromium
        timeout-minutes: 10
      - name: Install Chromium for PDF/export tests
        if: ${{ hashFiles('target/tests/pdf-export-audit.cjs', 'target/tests/english-mock-pdf-export.test.cjs') != '' }}
        run: npx playwright install chromium
        timeout-minutes: 5
      - name: Start target static server for export tests
        if: ${{ hashFiles('target/tests/pdf-export-audit.cjs', 'target/tests/english-mock-pdf-export.test.cjs') != '' }}
        working-directory: target
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/target-export-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/target-export-server.log
          exit 1
      - name: Run browser-level PDF and text export tests
        if: ${{ hashFiles('target/tests/pdf-export-audit.cjs', 'target/tests/english-mock-pdf-export.test.cjs') != '' }}
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/pdf-export-audit.cjs tests/english-mock-pdf-export.test.cjs; do
            if [ -f "$test" ]; then
              echo "Running $test"
              node "$test"
            fi
          done
      - name: Run read-only audit
        env:
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_DIR: target
          AUDIT_REPORT_PATH: audit-report.json
        run: |
          set -o pipefail
          node auditor/scripts/free-audit.cjs | tee audit-report.md
      - name: Run content duplicate and missing-field triage
        if: always()
        run: python auditor/scripts/content-quality-audit.py --root target --output content-quality-audit.json > content-quality-audit.stdout.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ strategy.job-index }}
          path: |
            audit-report.json
            audit-report.md
            content-quality-audit.json
            content-quality-audit.stdout.json
          if-no-files-found: warn
          retention-days: 30

  inventory-audit:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out audit tools
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test inventory auditor
        run: python scripts/automation-audit.py --self-test
      - name: Run expanded read-only inventory audit
        run: python scripts/automation-audit.py
      - name: Upload inventory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-inventory-audit
          path: |
            automation-reports/audit.json
            automation-reports/audit.md
            AUDIT_PHASE1_DATA_COUNTS_2026-10-29.md
            AUDIT_COMMON_TEST_2026-10-28.md
            AUDIT_GAP_CLASSIFICATION_AND_REBUILD_PLAN_2026-10-28.md
            AUTOMATION.md
          if-no-files-found: warn
          retention-days: 30
