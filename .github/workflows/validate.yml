name: Validate static site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML and inline JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, sys, tempfile
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.scripts=[]; self.active=False; self.buf=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.append(a['id'])
                  if tag=='script': self.active=True; self.buf=[]
              def handle_data(self, data):
                  if self.active: self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag=='script' and self.active: self.scripts.append(''.join(self.buf)); self.active=False
          files=list(Path('.').rglob('*.html')); failed=False
          if not files: sys.exit('No HTML files found')
          for f in files:
              a=Audit(); a.feed(f.read_text(encoding='utf-8'))
              dup=sorted({i for i in a.ids if a.ids.count(i)>1})
              if dup: print(f'Duplicate IDs in {f}: {dup}'); failed=True
              for n,js in enumerate(a.scripts):
                  if not js.strip(): continue
                  p=Path(tempfile.gettempdir())/f'inline-{abs(hash((str(f),n)))}.js'; p.write_text(js,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                  if r.returncode: print(f'JS syntax error in {f}, script {n+1}:\n{r.stderr}'); failed=True
              print(f'Checked {f}: {len(a.scripts)} scripts')
          if failed: sys.exit(1)
          PY
      - name: Check Stage 1 shared-feature coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          page = Path("shared-study-tools.html")
          if not page.exists():
              sys.exit("Missing shared-study-tools.html")
          html = page.read_text(encoding="utf-8")
          required_views = {
              "study plan": 'id="view-plan"',
              "review schedule": 'id="view-review"',
              "weakness analysis": 'id="view-weak"',
              "mistake notebook": 'id="view-notebook"',
              "study history and grades": 'id="view-history"',
              "mock exam and timer": 'id="view-exam"',
              "three-stage explanations": 'id="view-explain"',
          }
          missing = [name for name, marker in required_views.items() if marker not in html]
          required_behaviors = [
              'localStorage.setItem(KEY,JSON.stringify(data))',
              'id="export-data"',
              'id="import-data"',
              'id="clear-data"',
              'function renderAll()',
              'aria-selected',
              'aria-live="polite"',
          ]
          missing += [f"behavior: {marker}" for marker in required_behaviors if marker not in html]
          if missing:
              print("Stage 1 coverage missing:")
              print("\n".join(missing))
              sys.exit(1)
          tabs = html.count('class="tab"')
          if tabs != 7:
              sys.exit(f"Expected 7 shared-tool tabs, found {tabs}")
          print("Stage 1 static coverage passed: all 7 tool views, persistence, backup, reset, and accessibility hooks.")
          PY
      - name: Test A-plan maintenance safety
        run: node tests/daily-maintenance.test.cjs
