</style></head><body><header><p class="tag">PASS JUKEN ACADEMY · LEARNING HUB</p><h1>学びを、科目の壁を越えて。</h1><p class="muted">中学・高校の学習サイトをまとめた総合入口。科目を選び、要点整理・オリジナル演習・解説へ進もう。</p><label for="filter">科目を検索</label><input id="filter" placeholder="例：数学、理科、歴史"><p id="count" class="muted" aria-live="polite"></p></header><main><section class="grid" id="subjects"></section><section class="card" style="margin-top:18px"><h2>使い方</h2><ol><li>学びたい科目を選ぶ。</li><li>単元の要点を整理する。</li><li>演習問題を解き、解説を読んで理由まで理解する。</li><li>間違えた問題を復習してから次の単元へ。</li></ol><p class="muted">各サイトは順次拡充中です。問題は独自作成を基本とし、公開教材の無断転載は行いません。</p></section></main><footer>PASS JUKEN ACADEMY · 学習を少しずつ積み上げよう</footer><script>const subjects=[["中学国語","中学","junior-japanese"],["中学数学・埼玉入試","中学","math-juken-saitama"],["中学理科","中学","junior-science"],["中学社会","中学","junior-social-studies"],["高校国語","高校","highschool-japanese"],["高校数学","高校","highschool-math"],["総合英語","中学・高校","english-study"],["高校理科","高校","highschool-biology"],["高校社会（統合版）","高校","highschool-social-studies"],["高校情報I","高校","highschool-information"],["フィードバック","共通","learning-feedback"]];const practiceRepos=new Set(["highschool-japanese","highschool-math","highschool-biology","highschool-social-studies","highschool-information"]);const root=document.getElementById("subjects"),filter=document.getElementById("filter"),count=document.getElementById("count");function render(){const q=filter.value.trim().toLowerCase(),shown=subjects.filter(s=>s.join(" ").toLowerCase().includes(q));root.innerHTML=shown.map(s=>'<article class="card subject"><span class="tag">'+s[1]+' · SUBJECT</span><a href="https://pass-juken-academy2026.github.io/'+s[2]+'/">'+s[0]+' →</a><span class="muted">要点整理・演習・解説</span>'+(practiceRepos.has(s[2])?'<a class="practice-link" href="https://pass-juken-academy2026.github.io/'+s[2]+'/practice.html">▶ テストを開始（演習ラボ）</a>':'')+'</article>').join("");count.textContent=shown.length+" / "+subjects.length+" 科目";}filter.addEventListener("input",render);render();</script><style id="unified
