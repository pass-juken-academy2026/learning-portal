<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google-site-verification" content="mi_-sYmWc6J5m40NB-zwtPSApRsXMZXbgUnEJvr-9a4"><meta name="description" content="中学・高校の各科目を横断して学ぶ総合学習ポータル"><title>PASS JUKEN ACADEMY｜総合学習ポータル</title><style>:root{color-scheme:dark;--bg:#0b1020;--panel:#141d32;--line:#2a3855;--text:#edf3ff;--muted:#aab8d2;--accent:#8ab4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#18284b,var(--bg) 65%);color:var(--text);font:16px/1.7 system-ui,sans-serif}header,main{max-width:1120px;margin:auto;padding:24px}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.15}h2{margin-top:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#141d32eF;border:1px solid var(--line);border-radius:18px;padding:18px}.subject{display:flex;flex-direction:column;gap:5px}.subject a{color:var(--text);font-weight:750;text-decoration:none;font-size:1.08rem}.subject a:hover{color:var(--accent)}.tag{font-size:.8rem;color:var(--accent)}input,select{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0d1528;color:var(--text);width:100%}footer{padding:30px;text-align:center;color:var(--muted)}</style></head><body><header><p class="tag">PASS JUKEN ACADEMY · LEARNING HUB</p><h1>学びを、科目の壁を越えて。</h1><p class="muted">中学・高校の学習サイトをまとめた総合入口。科目を選び、要点整理・オリジナル演習・解説へ進もう。</p><label for="filter">科目を検索</label><input id="filter" placeholder="例：数学、理科、歴史"><p id="count" class="muted" aria-live="polite"></p></header><main><section class="grid" id="subjects"></section><section class="card" style="margin-top:18px"><h2>使い方</h2><ol><li>学びたい科目を選ぶ。</li><li>単元の要点を整理する。</li><li>演習問題を解き、解説を読んで理由まで理解する。</li><li>間違えた問題を復習してから次の単元へ。</li></ol><p class="muted">各サイトは順次拡充中です。問題は独自作成を基本とし、公開教材の無断転載は行いません。</p></section></main><footer>PASS JUKEN ACADEMY · 学習を少しずつ積み上げよう</footer><script>const subjects=[["中学国語","中学","junior-japanese"],["中学数学・埼玉入試","中学","math-juken-saitama"],["中学理科","中学","junior-science"],["中学社会","中学","junior-social-studies"],["高校国語","高校","highschool-japanese"],["高校数学","高校","highschool-math"],["高校英語","高校","english-study"],["高校生物","高校","highschool-biology"],["高校化学","高校","highschool-chemistry"],["高校物理","高校","highschool-physics"],["高校地学","高校","highschool-earth-science"],["高校地理・歴史総合","高校","highschool-social-studies"],["高校世界史","高校","World-history"],["高校日本史","高校","japanese-history-site"],["高校情報I","高校","highschool-information"],["世界史","高校","World-history"],["日本史","高校","japanese-history-site"],["フィードバック","共通","learning-feedback"]];const root=document.getElementById("subjects"),filter=document.getElementById("filter"),count=document.getElementById("count");function render(){const q=filter.value.trim().toLowerCase(),shown=subjects.filter(s=>s.join(" ").toLowerCase().includes(q));root.innerHTML=shown.map(s=>'<article class="card subject"><span class="tag">'+s[1]+' · SUBJECT</span><a href="https://pass-juken-academy2026.github.io/'+s[2]+'/">'+s[0]+' →</a><span class="muted">要点整理・演習・解説</span></article>').join("");count.textContent=shown.length+" / "+subjects.length+" 科目";}filter.addEventListener("input",render);render();</script><style id="unified-dark-theme">:root{color-scheme:dark}html,body{background:#071426!important;color:#edf5ff!important}body{background-image:radial-gradient(ellipse at top right,#14345a 0,transparent 48%)!important}main,section,article,.card,.panel,.container,.content,.box,fieldset,details{color:#edf5ff}.card,.panel,.box,article,fieldset,details{background:#10233d!important;border:1px solid #294563!important;border-radius:16px!important;box-shadow:0 8px 24px #0003}p,li,small,.muted,.description{color:#c3d5e9}h1,h2,h3,h4,strong{color:#f3f8ff}a{color:#7bdcff}button,input,select,textarea{font:inherit;border-radius:10px}button{background:#17658b!important;color:#fff!important;border:1px solid #438bb0!important;padding:.65rem 1rem;cursor:pointer}input,select,textarea{background:#091a2e!important;color:#f3f8ff!important;border:1px solid #355575!important;padding:.65rem}hr{border-color:#294563}</style></body></html>
